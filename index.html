    let firebaseDB = null;

    const FIREBASE_CONFIG = {

    function initFirebase() {
      if (FIREBASE_CONFIG.databaseURL && typeof firebase !== "undefined") {
        try {
          const app = firebase.initializeApp(FIREBASE_CONFIG);
          firebaseDB = firebase.database();
          console.log("[Firebase] Initialized successfully");
          return true;
        } catch (e) { console.warn("[Firebase] Init failed:", e); }
      }
      return false;
    }

    function genRoom() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

    function createRoom() {
      if (!firebaseDB) return null;
      const room = genRoom();
      joinRoom(room);
      return room;
    }

    function joinRoom(room) {
      if (!firebaseDB) return;
      currentRoom = room;
      try { localStorage.setItem("qiuzhao-room", room); } catch {}
      // Update URL hash
      window.location.hash = "room=" + room;
      console.log("[Firebase] Joined room:", room);
    }

    function setupSync(setApps, setEvents, setNotes) {
      if (!firebaseDB || !currentRoom) return;
      const ref = firebaseDB.ref("rooms/" + currentRoom);

      ref.on("value", snap => {
        if (_remoteUpdate) { _remoteUpdate = false; return; }
        const data = snap.val();
        if (!data) return;
        _remoteUpdate = true;
        if (data.apps) setApps(data.apps);
        if (data.events) setEvents(data.events);
        if (data.notes) setNotes(data.notes);
        setTimeout(() => { _remoteUpdate = false; }, 100);
      });
    }

    function pushToFirebase(apps, events, notes) {
      if (!firebaseDB || !currentRoom || _remoteUpdate) return;
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(() => {
        try {
          firebaseDB.ref("rooms/" + currentRoom).update({
            apps, events, notes,
            updatedAt: firebase.database.ServerValue.TIMESTAMP,
          });
        } catch (e) { console.warn("[Firebase] Push failed:", e); }
      }, 500);
    }

    function BarChartCustom({ data }) {
      const max = Math.max(...data.map(d => d.count), 1);
      const barH = 28, gap = 10, labelW = 64, chartW = 280, padR = 40;
      const h = data.length * (barH + gap) + 10;
      return (
        <svg viewBox={`0 0 ${labelW + chartW + padR} ${h}`} className="w-full" style={{ maxHeight: 220 }}>
          {data.map((d, i) => {
            const y = i * (barH + gap) + 5;
            const w = (d.count / max) * chartW;
            return (
              <g key={i}>
                <text x={labelW - 6} y={y + barH / 2 + 4} textAnchor="end" fontSize="11" fill="#6b7280">{d.name}</text>
                <rect x={labelW} y={y} width={w} height={barH} rx="6" fill={d.fill} opacity="0.85" />
                <text x={labelW + w + 6} y={y + barH / 2 + 4} fontSize="12" fontWeight="600" fill="#374151">{d.count}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    function DonutChart({ data }) {
      const total = data.reduce((s, d) => s + d.value, 0);
      if (total === 0) return null;
      const r = 70, ir = 42, cx = 100, cy = 100;
      let angle = -Math.PI / 2;
      const arcs = data.map(d => {
        const sweep = (d.value / total) * Math.PI * 2;
        const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
        const x2 = cx + r * Math.cos(angle + sweep), y2 = cy + r * Math.sin(angle + sweep);
        const ix1 = cx + ir * Math.cos(angle + sweep), iy1 = cy + ir * Math.sin(angle + sweep);
        const ix2 = cx + ir * Math.cos(angle), iy2 = cy + ir * Math.sin(angle);
        const large = sweep > Math.PI ? 1 : 0;
        const path = `M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${ix1},${iy1} A${ir},${ir} 0 ${large} 0 ${ix2},${iy2} Z`;
        angle += sweep;
        return { ...d, path };
      });
      return (
        <div className="flex items-center gap-6 justify-center">
          <svg viewBox="0 0 200 200" width="180" height="180">
            {arcs.map((a, i) => <path key={i} d={a.path} fill={a.fill} />)}
            <text x={cx} y={cy - 4} textAnchor="middle" fontSize="22" fontWeight="bold" fill="#1f2937">{total}</text>
            <text x={cx} y={cy + 14} textAnchor="middle" fontSize="11" fill="#9ca3af">总计</text>
          </svg>
          <div className="space-y-2">
            {data.map((d, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: d.fill }} />
                <span className="text-gray-600">{d.name}</span>
                <span className="font-semibold text-gray-800 ml-1">{d.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ─── Calendar ─── */
    function CalendarView({ events, onAddEvent, onDeleteEvent, onEditEvent }) {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth());
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      const eventsByDay = useMemo(() => {
        const m = {}; events.forEach(e => { if (!m[e.date]) m[e.date] = []; m[e.date].push(e); }); return m;
      }, [events]);
      const dk = d => d ? `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}` : null;
      const isToday = d => d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      const prev = () => { if (month===0) { setMonth(11); setYear(y=>y-1); } else setMonth(m=>m-1); };
      const next = () => { if (month===11) { setMonth(0); setYear(y=>y+1); } else setMonth(m=>m+1); };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <div className="flex items-center justify-between mb-5">
              <button onClick={prev} className="p-2 rounded-lg hover:bg-gray-100 transition"><Icon name="chevronL" size={18} className="text-gray-500" /></button>
              <h3 className="text-base font-bold text-gray-800">{year} 年 {month + 1} 月</h3>
              <button onClick={next} className="p-2 rounded-lg hover:bg-gray-100 transition"><Icon name="chevronR" size={18} className="text-gray-500" /></button>
            </div>
            <div className="grid grid-cols-7 gap-1 mb-2">
              {WEEKDAYS.map(w => <div key={w} className="text-center text-xs font-semibold text-gray-400 py-1">{w}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                const key = dk(d); const dayEvts = key ? (eventsByDay[key]||[]) : [];
                return (
                  <div key={i} className={`relative min-h-16 rounded-lg p-1.5 transition-colors ${d ? "hover:bg-indigo-50/50" : ""} ${d && isToday(d) ? "bg-indigo-50 ring-2 ring-indigo-200" : ""}`}>
                    {d && (<>
                      <span className={`text-xs font-medium ${isToday(d) ? "text-indigo-600" : "text-gray-500"}`}>{d}</span>
                      <div className="mt-1 space-y-0.5">
                        {dayEvts.slice(0,2).map(e => {
                          const et = EVENT_TYPES.find(t=>t.key===e.type) || EVENT_TYPES[4];
                          return (
                            <div key={e.id} className="flex items-center gap-1 group/ev">
                              <div className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{backgroundColor:et.color}} />
                              <span className="text-xs text-gray-600 truncate flex-1 cursor-pointer hover:text-indigo-600" title={`${e.company} - ${e.notes}`} onClick={()=>onEditEvent && onEditEvent(e)}>{e.company}</span>
                              <button onClick={()=>onDeleteEvent(e.id)} className="opacity-0 group-hover/ev:opacity-100 text-gray-300 hover:text-red-400"><Icon name="trash" size={10} /></button>
                            </div>
                          );
                        })}
                        {dayEvts.length > 2 && <span className="text-xs text-gray-300">+{dayEvts.length - 2}</span>}
                      </div>
                    </>)}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-sm font-semibold text-gray-700 flex items-center gap-2"><Icon name="clock" size={16} style={{color:"#3b82f6"}} /> 即将到来</h3>
              <button onClick={onAddEvent} className="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-indigo-500 text-white text-xs font-medium hover:bg-indigo-600 transition"><Icon name="plus" size={13} /> 添加事件</button>
            </div>
            {(() => {
              const upcoming = events.filter(e => e.date >= today.toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));
              return upcoming.length === 0
                ? <p className="text-xs text-gray-300 py-4 text-center">暂无即将到来的事件</p>
                : <div className="space-y-2">{upcoming.map(e => {
                    const et = EVENT_TYPES.find(t=>t.key===e.type) || EVENT_TYPES[4];
                    return (
                      <div key={e.id} className="flex items-center gap-3 py-2 px-3 rounded-lg hover:bg-gray-50 transition group">
                        <span className="text-xs font-mono text-gray-400 w-20 flex-shrink-0">{e.date.slice(5)}</span>
                        <span className="px-2 py-0.5 rounded text-white text-xs font-medium flex-shrink-0" style={{backgroundColor:et.color}}>{et.label}</span>
                        <span className="text-sm font-medium text-gray-700">{e.company}</span>
                        <span className="text-xs text-gray-400 flex-1 truncate">{e.notes}</span>
                        <button onClick={()=>onEditEvent && onEditEvent(e)} className="opacity-0 group-hover:opacity-100 transition-opacity text-gray-300 hover:text-blue-500"><Icon name="edit" size={13} /></button>
                        <button onClick={()=>onDeleteEvent(e.id)} className="opacity-0 group-hover:opacity-100 transition-opacity text-gray-300 hover:text-red-400"><Icon name="trash" size={13} /></button>
                      </div>
                    );
                  })}</div>;
            })()}
          </div>
        </div>
      );
    }

    /* ─── Resume Management ─── */
    function ResumeTab({ resumes, onUpload, onDeleteResume }) {
      const fileRef = useRef(null);
      const [verLabel, setVerLabel] = useState("");
      const [verNotes, setVerNotes] = useState("");

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert("文件不能超过 5MB"); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          onUpload({
            id: Date.now(),
            name: file.name,
            size: file.size,
            type: file.type,
            version: verLabel || `v${resumes.length + 1}`,
            notes: verNotes,
            uploadDate: new Date().toISOString().slice(0, 10),
            dataUrl: ev.target.result,
          });
          setVerLabel("");
          setVerNotes("");
        };
        reader.readAsDataURL(file);
        if (fileRef.current) fileRef.current.value = "";
      };

      const fmtSize = (b) => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1) + " KB" : (b/1048576).toFixed(1) + " MB";

      return (
        <div className="space-y-6 fade-in">
          {/* Upload Area */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h3 className="text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2">
              <Icon name="upload" size={16} style={{color:"#6366f1"}} /> 上传新版简历
            </h3>
            <div className="flex flex-col sm:flex-row gap-3">
              <input type="text" value={verLabel} onChange={e=>setVerLabel(e.target.value)} placeholder="版本标记 (如 v3, 终稿)" className="flex-1 rounded-lg border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200" />
              <input type="text" value={verNotes} onChange={e=>setVerNotes(e.target.value)} placeholder="改动说明 (如: 增加了实习经历)" className="flex-1 rounded-lg border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200" />
              <label className="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition cursor-pointer shadow-lg shadow-indigo-200 whitespace-nowrap">
                <Icon name="upload" size={15} /> 选择文件
                <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" onChange={handleFile} className="hidden" />
              </label>
            </div>
            <p className="text-xs text-gray-400 mt-2">支持 PDF、DOC、DOCX，最大 5MB</p>
          </div>

          {/* Version History */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h3 className="text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2">
              <Icon name="file" size={16} style={{color:"#10b981"}} /> 版本历史 ({resumes.length})
            </h3>
            {resumes.length === 0 ? (
              <div className="text-center py-8">
                <Icon name="file" size={36} className="mx-auto text-gray-200 mb-2" />
                <p className="text-sm text-gray-400">还没有简历，上传你的第一份吧</p>
              </div>
            ) : (
              <div className="space-y-3">
                {resumes.map((r, idx) => (
                  <div key={r.id} className="flex items-center gap-4 p-3 rounded-xl border border-gray-100 hover:border-indigo-200 hover:bg-indigo-50/30 transition group">
                    <div className="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style={{backgroundColor: idx===0 ? "#6366f118" : "#f3f4f6"}}>
                      <Icon name="file" size={18} style={{color: idx===0 ? "#6366f1" : "#9ca3af"}} />
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-0.5">
                        <span className="font-semibold text-sm text-gray-800">{r.name}</span>
                        <span className="px-2 py-0.5 rounded-full text-xs font-semibold" style={{backgroundColor: idx===0 ? "#6366f1" : "#e5e7eb", color: idx===0 ? "white" : "#6b7280"}}>{r.version}</span>
                        {idx === 0 && <span className="px-1.5 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700">最新</span>}
                      </div>
                      <div className="flex items-center gap-3 text-xs text-gray-400">
                        <span>{r.uploadDate}</span>
                        <span>{fmtSize(r.size)}</span>
                        {r.notes && <span className="text-indigo-500">{r.notes}</span>}
                      </div>
                    </div>
                    <a href={r.dataUrl} download={r.name} className="opacity-0 group-hover:opacity-100 transition-opacity p-2 rounded-lg hover:bg-indigo-100 text-indigo-500" title="下载"><Icon name="download" size={15} /></a>
                    <button onClick={() => onDeleteResume(r.id)} className="opacity-0 group-hover:opacity-100 transition-opacity p-2 rounded-lg hover:bg-red-100 text-red-400" title="删除"><Icon name="trash" size={15} /></button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ─── Collaboration Status ─── */
    function CollabBar({ firebaseReady, room, onCreateRoom, onJoinRoom }) {
      const [input, setInput] = useState("");
      const [showInput, setShowInput] = useState(false);
      const [copied, setCopied] = useState(false);

      const shareUrl = room ? `${window.location.origin}${window.location.pathname}#room=${room}` : "";
      const copyLink = () => {
        if (!shareUrl) return;
        navigator.clipboard.writeText(shareUrl).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
      };

      if (!firebaseReady) {
        return (
          <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-center gap-3 text-sm">
            <Icon name="wifiOff" size={16} style={{color:"#f59e0b"}} />
            <span className="text-amber-700 text-xs">多人协作未配置。在 HTML 文件顶部的 <code className="bg-amber-100 px-1 rounded">FIREBASE_CONFIG</code> 中填入 Firebase 配置即可开启实时同步。</span>
          </div>
        );
      }

      if (!room) {
        return (
          <div className="bg-indigo-50 border border-indigo-200 rounded-xl px-4 py-3 flex items-center gap-3 flex-wrap">
            <Icon name="share" size={16} style={{color:"#6366f1"}} />
            <span className="text-xs text-indigo-700 font-medium">开启多人协作</span>
            <button onClick={onCreateRoom} className="px-3 py-1 rounded-lg bg-indigo-500 text-white text-xs font-medium hover:bg-indigo-600 transition">创建房间</button>
            {!showInput ? (
              <button onClick={() => setShowInput(true)} className="px-3 py-1 rounded-lg bg-white border border-indigo-200 text-indigo-600 text-xs font-medium hover:bg-indigo-50 transition">加入房间</button>
            ) : (
              <div className="flex items-center gap-2">
                <input value={input} onChange={e=>setInput(e.target.value.toUpperCase())} placeholder="输入房间码" className="w-24 rounded-lg border border-indigo-200 px-2 py-1 text-xs text-center font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-indigo-200" maxLength={6} />
                <button onClick={() => { if(input.length >= 4) { onJoinRoom(input); setShowInput(false); setInput(""); } }} className="px-3 py-1 rounded-lg bg-indigo-500 text-white text-xs font-medium hover:bg-indigo-600 transition">加入</button>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="bg-green-50 border border-green-200 rounded-xl px-4 py-3 flex items-center gap-3 flex-wrap">

            <span className="text-xs text-green-700 font-medium">已连接</span>

          <span className="text-xs text-gray-500">房间码</span>

    /* ═══════ Modals ═══════ */
    function Modal({ title, onClose, children }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm fade-in" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 m-4 max-h-[90vh] overflow-y-auto scale-in" onClick={e => e.stopPropagation()}>
            <h3 className="text-lg font-bold text-gray-800 mb-5">{title}</h3>
            {children}
          </div>
        </div>
      );
    }

    function AppModal({ initial, onSave, onClose }) {
      const empty = { company:"", position:"后端开发", department:"", status:"pending", currentStage:"简历投递", appliedDate: new Date().toISOString().slice(0,10), baseSalary:"", months:"", signingBonus:"", rsu:"", city:"", wlb:"", notes:"" };
      const [form, setForm] = useState({ ...empty, ...initial });
      const set = k => e => setForm({ ...form, [k]: e.target.value });
      const isEdit = !!initial?.id;
      const inputCls = "w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition";
      return (
        <Modal title={isEdit ? "编辑投递记录" : "添加投递记录"} onClose={onClose}>
          <div className="space-y-3">
            {[
              {l:"公司",k:"company",p:"如：字节跳动",r:true},
              {l:"岗位",k:"position",p:"如：后端开发"},
              {l:"部门",k:"department",p:"可选"},
              {l:"投递日期",k:"appliedDate",t:"date"},
              {l:"城市",k:"city",p:"如：杭州"},
            ].map(({l,k,p,t,r}) => (
              <div key={k}><label className="text-xs font-medium text-gray-500 mb-1 block">{l}{r&&<span className="text-red-400 ml-0.5">*</span>}</label><input type={t||"text"} value={form[k]} onChange={set(k)} placeholder={p} className={inputCls} /></div>
            ))}
            <div className="flex gap-3">
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">状态</label><select value={form.status} onChange={set("status")} className={inputCls}>{Object.entries(STATUS_MAP).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></div>
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">当前阶段</label><select value={form.currentStage} onChange={set("currentStage")} className={inputCls}>{STAGES.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            </div>
            <div className="border-t border-gray-100 pt-3 mt-3">
              <p className="text-xs font-semibold text-gray-500 mb-3 flex items-center gap-1.5"><Icon name="dollar" size={13} /> 薪资详情（Offer 时填写）</p>
              <div className="grid grid-cols-2 gap-3">
                {[{l:"月薪 (k)",k:"baseSalary",p:"如：25"},{l:"月数",k:"months",p:"如：16"},{l:"签字费 (w)",k:"signingBonus",p:"如：3"},{l:"RSU/期权",k:"rsu",p:"如：10w/年"},{l:"WLB (1-10)",k:"wlb",p:"1=卷死 10=WLB"}].map(({l,k,p})=>(
                  <div key={k}><label className="text-xs text-gray-400 mb-1 block">{l}</label><input type="text" value={form[k]} onChange={set(k)} placeholder={p} className={inputCls} /></div>
                ))}
              </div>
            </div>
            <div><label className="text-xs font-medium text-gray-500 mb-1 block">备注</label><textarea value={form.notes} onChange={set("notes")} placeholder="面试感受、重点题目等" rows={2} className={`${inputCls} resize-none`} /></div>
          </div>
          <div className="flex gap-3 mt-6">
            <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-500 hover:bg-gray-50 transition">取消</button>
            <button onClick={() => { if (form.company.trim()) onSave(form); }} className="flex-1 py-2.5 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition shadow-lg shadow-indigo-200">{isEdit ? "保存" : "添加"}</button>
          </div>
        </Modal>
      );
    }

    function EventModal({ initial, onSave, onClose }) {
      const [form, setForm] = useState({ date: new Date().toISOString().slice(0,10), type: "interview", company: "", notes: "", ...initial });
      const set = k => e => setForm({ ...form, [k]: e.target.value });
      const isEdit = !!initial?.id;
      const inputCls = "w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition";
      return (
        <Modal title={isEdit ? "编辑事件" : "添加日历事件"} onClose={onClose}>
          <div className="space-y-3">
            <div><label className="text-xs font-medium text-gray-500 mb-1 block">公司 <span className="text-red-400">*</span></label><input value={form.company} onChange={set("company")} placeholder="如：字节跳动" className={inputCls} /></div>
            <div className="flex gap-3">
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">日期</label><input type="date" value={form.date} onChange={set("date")} className={inputCls} /></div>
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">类型</label><select value={form.type} onChange={set("type")} className={inputCls}>{EVENT_TYPES.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}</select></div>
            </div>
            <div><label className="text-xs font-medium text-gray-500 mb-1 block">备注</label><input value={form.notes} onChange={set("notes")} placeholder="如：二面 - 系统设计" className={inputCls} /></div>
          </div>
          <div className="flex gap-3 mt-6">
            <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-500 hover:bg-gray-50 transition">取消</button>
            <button onClick={() => { if (form.company.trim() && form.date) onSave(form); }} className="flex-1 py-2.5 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition shadow-lg shadow-indigo-200">{isEdit ? "保存" : "添加"}</button>
          </div>
        </Modal>
      );
    }

    function NoteModal({ initial, apps, onSave, onClose }) {
      const empty = { appId: apps[0]?.id || "", company: "", stage: "一面", date: new Date().toISOString().slice(0,10), rating: 3, summary: "", entries: [] };
      const [form, setForm] = useState({ ...empty, ...initial });
      const set = k => e => setForm({ ...form, [k]: e.target.value });
      const inputCls = "w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 transition";
      const isEdit = !!initial?.id;

      const addEntry = () => setForm({ ...form, entries: [...form.entries, { question: "", answer: "", good: true }] });
      const updateEntry = (idx, field, val) => { const es = [...form.entries]; es[idx] = { ...es[idx], [field]: val }; setForm({ ...form, entries: es }); };
      const removeEntry = idx => setForm({ ...form, entries: form.entries.filter((_,i) => i !== idx) });

      const handleSave = () => {
        if (!form.company.trim()) return;
        const matchedApp = apps.find(a => a.company === form.company);
        onSave({ ...form, id: form.id || Date.now(), appId: matchedApp?.id || form.appId });
      };

      return (
        <Modal title={isEdit ? "编辑面试复盘" : "添加面试复盘"} onClose={onClose}>
          <div className="space-y-3">
            <div className="flex gap-3">
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">公司 <span className="text-red-400">*</span></label>
                <select value={form.company} onChange={e => { const app = apps.find(a=>a.id===+e.target.value); setForm({...form, company: app?.company || e.target.value, appId: app?.id || ""}); }} className={inputCls}>
                  <option value="">选择公司</option>
                  {apps.map(a => <option key={a.id} value={a.id}>{a.company}</option>)}
                </select>
              </div>
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">阶段</label>
                <select value={form.stage} onChange={set("stage")} className={inputCls}>{STAGES.filter(s=>s!=="简历投递").map(s=><option key={s} value={s}>{s}</option>)}</select>
              </div>
            </div>
            <div className="flex gap-3">
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">日期</label><input type="date" value={form.date} onChange={set("date")} className={inputCls} /></div>
              <div className="flex-1"><label className="text-xs font-medium text-gray-500 mb-1 block">整体评分</label>
                <div className="flex gap-1 mt-1">
                  {[1,2,3,4,5].map(r => (
                    <button key={r} onClick={() => set("rating")({target:{value:r}})} className={`w-8 h-8 rounded-lg text-sm font-bold transition ${form.rating >= r ? "text-white" : "bg-gray-100 text-gray-400"}`} style={form.rating >= r ? {backgroundColor: ["","#ef4444","#f59e0b","#3b82f6","#10b981","#10b981"][r]} : {}}>{r}</button>
                  ))}
                </div>
              </div>
            </div>
            <div><label className="text-xs font-medium text-gray-500 mb-1 block">总结</label><textarea value={form.summary} onChange={set("summary")} placeholder="整体感受、亮点和不足..." rows={2} className={`${inputCls} resize-none`} /></div>

            <div className="border-t border-gray-100 pt-3">
              <div className="flex items-center justify-between mb-2">
                <label className="text-xs font-semibold text-gray-500">面试题目 ({form.entries.length})</label>
                <button onClick={addEntry} className="text-xs text-indigo-500 hover:text-indigo-700 flex items-center gap-1"><Icon name="plus" size={12} /> 添加题目</button>
              </div>
              <div className="space-y-2 max-h-60 overflow-y-auto">
                {form.entries.map((entry, idx) => (
                  <div key={idx} className="p-3 rounded-lg bg-gray-50 space-y-2">
                    <div className="flex items-start gap-2">
                      <span className="text-xs font-semibold text-gray-400 mt-2 flex-shrink-0">Q{idx+1}</span>
                      <input value={entry.question} onChange={e => updateEntry(idx, "question", e.target.value)} placeholder="被问到的问题" className={inputCls} />
                      <button onClick={() => removeEntry(idx)} className="text-gray-300 hover:text-red-400 mt-2 flex-shrink-0"><Icon name="trash" size={13} /></button>
                    </div>
                    <div className="pl-8">
                      <input value={entry.answer} onChange={e => updateEntry(idx, "answer", e.target.value)} placeholder="你的回答要点" className={inputCls} />
                      <div className="flex gap-2 mt-1">
                        <button onClick={() => updateEntry(idx, "good", true)} className={`text-xs px-2 py-0.5 rounded transition ${entry.good ? "bg-green-100 text-green-700" : "text-gray-400"}`}>答得好</button>
                        <button onClick={() => updateEntry(idx, "good", false)} className={`text-xs px-2 py-0.5 rounded transition ${!entry.good ? "bg-red-100 text-red-700" : "text-gray-400"}`}>需改进</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="flex gap-3 mt-6">
            <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-500 hover:bg-gray-50 transition">取消</button>
            <button onClick={handleSave} className="flex-1 py-2.5 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition shadow-lg shadow-indigo-200">{isEdit ? "保存" : "添加"}</button>
          </div>
        </Modal>
      );
    }

    /* ═══════ Main App ═══════ */
    function App() {
      const saved = useMemo(() => loadState(), []);
      const [apps, setApps] = useState(saved?.apps || SEED_APPS);
      const [events, setEvents] = useState(saved?.events || SEED_EVENTS);
      const [resumes, setResumes] = useState(saved?.resumes || []);
      const [notes, setNotes] = useState(saved?.notes || SEED_NOTES);
      const [tab, setTab] = useState("dashboard");
      const [filter, setFilter] = useState("all");
      const [appModal, setAppModal] = useState(null);
      const [eventModal, setEventModal] = useState(null);
      const [noteModal, setNoteModal] = useState(null);

      // Firebase init
      const [firebaseReady, setFirebaseReady] = useState(false);
      const [room, setRoom] = useState(null);

      useEffect(() => {
        const ready = initFirebase();
        setFirebaseReady(ready);
        if (ready) {
          // Check URL hash or localStorage for room
          const hashRoom = window.location.hash.match(/room=([A-Z0-9]+)/i)?.[1]?.toUpperCase();
          const savedRoom = hashRoom || (() => { try { return localStorage.getItem("qiuzhao-room"); } catch { return null; } })();
          if (savedRoom) {
            joinRoom(savedRoom);
            setRoom(savedRoom);
            setupSync(setApps, setEvents, setNotes);
          }
        }
      }, []);

      // Auto-save to localStorage
      useEffect(() => { saveState(apps, events, resumes, notes); }, [apps, events, resumes, notes]);

      // Push to Firebase when state changes
      useEffect(() => {
        if (firebaseReady && room) pushToFirebase(apps, events, notes);
      }, [apps, events, notes]);

      const stats = useMemo(() => {
        const t = apps.length, o = apps.filter(a=>a.status==="offer").length, iv = apps.filter(a=>a.status==="interviewing").length;
        const r = apps.filter(a=>a.status==="rejected").length, p = apps.filter(a=>a.status==="pending").length;
        return { total:t, offers:o, interviewing:iv, rejected:r, pending:p, offerRate:t?((o/t)*100).toFixed(0):0, passRate:t?(((t-r)/t)*100).toFixed(0):0 };
      }, [apps]);

      const filtered = useMemo(() => filter==="all" ? apps : apps.filter(a=>a.status===filter), [apps, filter]);

      const saveApp = form => {
        if (form.id) setApps(prev => prev.map(a => a.id===form.id ? form : a));
        else setApps(prev => [...prev, { ...form, id: Date.now() }]);
        setAppModal(null);
      };
      const deleteApp = id => { setApps(prev => prev.filter(a=>a.id!==id)); setEvents(prev => prev.filter(e=>e.appId!==id)); setNotes(prev => prev.filter(n=>n.appId!==id)); };
      const saveEvent = form => {
        if (form.id) setEvents(prev => prev.map(e => e.id===form.id ? form : e));
        else setEvents(prev => [...prev, { ...form, id: Date.now() }]);
        setEventModal(null);
      };
      const deleteEvent = id => setEvents(prev => prev.filter(e=>e.id!==id));
      const uploadResume = r => setResumes(prev => [r, ...prev]);
      const deleteResume = id => setResumes(prev => prev.filter(r=>r.id!==id));
      const saveNote = n => {
        if (n.id && notes.find(x => x.id === n.id)) setNotes(prev => prev.map(x => x.id===n.id ? n : x));
        else setNotes(prev => [...prev, n]);
      };
      const deleteNote = id => setNotes(prev => prev.filter(n=>n.id!==id));

      const handleCreateRoom = () => { const r = createRoom(); if (r) { setRoom(r); setupSync(setApps, setEvents, setNotes); } };
      const handleJoinRoom = (r) => { joinRoom(r); setRoom(r); setupSync(setApps, setEvents, setNotes); };

      const funnelData = useMemo(() => {
        const active = apps.filter(a=>a.status!=="withdrawn");
        return STAGES.map(s => ({ name:s, count: active.filter(a=> STAGES.indexOf(a.currentStage)>=STAGES.indexOf(s)||a.currentStage===s).length, fill:STAGE_COLORS[s] }));
      }, [apps]);
      const pieData = useMemo(() => {
        const c = {}; apps.forEach(a => { c[a.status]=(c[a.status]||0)+1; });
        return Object.entries(STATUS_MAP).map(([k,v])=>({ name:v.label, value:c[k]||0, fill:v.color })).filter(d=>d.value>0);
      }, [apps]);

      const tabs = [
        { key:"dashboard", label:"总览", icon:"trendingUp" },
        { key:"pipeline",  label:"管线", icon:"send" },
        { key:"list",      label:"列表", icon:"briefcase" },
        { key:"offers",    label:"Offer", icon:"dollar" },
        { key:"calendar",  label:"日历", icon:"calendar" },
        { key:"resume",    label:"简历", icon:"file" },
        { key:"notes",     label:"复盘", icon:"note" },
      ];

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-white to-indigo-50/30">
          {/* header */}
          <div className="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center"><Icon name="briefcase" size={18} className="text-white" /></div>
                <div>
                  <h1 className="text-lg font-bold text-gray-800">秋招进度看板</h1>
                  <p className="text-xs text-gray-400">2026 秋季校招 {"\u00b7"} 数据已自动保存</p>
                </div>
              </div>
              <button onClick={()=>setAppModal("new")} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition shadow-lg shadow-indigo-200"><Icon name="plus" size={16} /> 添加投递</button>
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6">
            {/* Collab Bar */}
            <div className="mb-4">
              <CollabBar firebaseReady={firebaseReady} room={room} onCreateRoom={handleCreateRoom} onJoinRoom={handleJoinRoom} />
            </div>

            {/* tabs */}
            <div className="flex gap-1 bg-gray-100/80 rounded-xl p-1 mb-6 w-fit overflow-x-auto">
              {tabs.map(({key,label,icon}) => (
                <button key={key} onClick={()=>setTab(key)} className={`flex items-center gap-1.5 px-3 sm:px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 whitespace-nowrap ${tab===key ? "bg-white text-indigo-600 shadow-sm" : "text-gray-500 hover:text-gray-700"}`}>
                  <Icon name={icon} size={15} /> <span className="hidden sm:inline">{label}</span>
                </button>
              ))}
            </div>

            {/* dashboard */}
            {tab === "dashboard" && (
              <div className="space-y-6 fade-in">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <StatCard icon="send"    label="总投递"     value={stats.total}        sub={`${stats.pending} 待回复`}     color="#6366f1" />
                  <StatCard icon="users"   label="面试中"     value={stats.interviewing} sub="正在进行"                     color="#3b82f6" />
                  <StatCard icon="award"   label="已拿 Offer" value={stats.offers}       sub={`转化率 ${stats.offerRate}%`} color="#10b981" />
                  <StatCard icon="xCircle" label="已拒"       value={stats.rejected}     sub={`通过率 ${stats.passRate}%`}  color="#ef4444" />
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h3 className="text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2"><Icon name="trendingUp" size={16} style={{color:"#6366f1"}} /> 投递漏斗</h3>
                    <BarChartCustom data={funnelData} />
                  </div>
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h3 className="text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2"><Icon name="star" size={16} style={{color:"#f59e0b"}} /> 状态分布</h3>
                    <DonutChart data={pieData} />
                  </div>
                </div>
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                  <h3 className="text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2"><Icon name="calendar" size={16} style={{color:"#3b82f6"}} /> 近期动态</h3>
                  <div className="space-y-2">
                    {[...apps].sort((a,b)=>b.appliedDate.localeCompare(a.appliedDate)).slice(0,5).map(a => (
                      <div key={a.id} className="flex items-center gap-3 py-2 px-3 rounded-lg hover:bg-gray-50 transition">
                        <div className="w-2 h-2 rounded-full flex-shrink-0" style={{backgroundColor:STATUS_MAP[a.status]?.color}} />
                        <span className="text-sm text-gray-700 font-medium">{a.company}</span>
                        <span className="text-xs text-gray-400">{a.position}</span>
                        <Icon name="chevronR" size={14} className="text-gray-300" />
                        <span className="text-xs text-gray-400">{a.currentStage}</span>
                        <span className="ml-auto text-xs text-gray-300">{a.appliedDate}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === "pipeline" && (
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 fade-in">
                <h3 className="text-sm font-semibold text-gray-700 mb-6 flex items-center gap-2"><Icon name="send" size={16} style={{color:"#6366f1"}} /> 投递进度管线</h3>
                <PipelineView apps={apps} />
              </div>
            )}

            {tab === "list" && (
              <div className="space-y-4 fade-in">
                <div className="flex items-center gap-2 flex-wrap">
                  <Icon name="filter" size={14} className="text-gray-400" />
                  {[{key:"all",label:"全部"}, ...Object.entries(STATUS_MAP).map(([k,v])=>({key:k,label:v.label}))].map(({key,label}) => (
                    <button key={key} onClick={()=>setFilter(key)} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${filter===key ? "bg-indigo-500 text-white shadow-sm" : "bg-white text-gray-500 border border-gray-200 hover:border-indigo-200"}`}>{label}</button>
                  ))}
                  <span className="ml-auto text-xs text-gray-400">{filtered.length} 条记录</span>
                </div>
                <div className="space-y-2">{filtered.map(a=><AppRow key={a.id} app={a} onDelete={deleteApp} onEdit={setAppModal} onNotes={app => setNoteModal(app)} />)}</div>
              </div>
            )}

            {tab === "offers" && (
              <div className="space-y-4 fade-in">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-semibold text-gray-700 flex items-center gap-2"><Icon name="dollar" size={16} style={{color:"#10b981"}} /> Offer 横向对比</h3>
                  <button onClick={()=>setAppModal("new")} className="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-indigo-500 text-white text-xs font-medium hover:bg-indigo-600 transition"><Icon name="plus" size={13} /> 添加</button>
                </div>
                <OfferCompare apps={apps} onEdit={setAppModal} />
              </div>
            )}

            {tab === "calendar" && (
              <div className="fade-in">
                <CalendarView events={events} onAddEvent={()=>setEventModal("new")} onDeleteEvent={deleteEvent} onEditEvent={e => setEventModal(e)} />
              </div>
            )}

            {tab === "resume" && (
              <ResumeTab resumes={resumes} onUpload={uploadResume} onDeleteResume={deleteResume} />
            )}

            {tab === "notes" && (
              <InterviewNotesView notes={notes} apps={apps} onSaveNote={saveNote} onDeleteNote={deleteNote} />
            )}
          </div>

          {appModal && <AppModal initial={appModal==="new"?null:appModal} onSave={saveApp} onClose={()=>setAppModal(null)} />}
          {eventModal && <EventModal initial={eventModal==="new"?null:eventModal} onSave={saveEvent} onClose={()=>setEventModal(null)} />}
          {noteModal && noteModal !== true && <NoteModal initial={noteModal.company ? { company: noteModal.company, appId: noteModal.id } : null} apps={apps} onSave={saveNote} onClose={()=>setNoteModal(null)} />}
          {noteModal === true && <NoteModal initial={null} apps={apps} onSave={saveNote} onClose={()=>setNoteModal(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
